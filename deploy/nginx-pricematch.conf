server {
    # Cloudflared rulează pe același VPS. Portul nu este expus pe interfața publică.
    listen 127.0.0.1:8080;
    server_name preturi.example.ro;

    server_tokens off;
    client_max_body_size 55m;

    access_log /var/log/nginx/pricematch.access.log;
    error_log /var/log/nginx/pricematch.error.log warn;

    # CF-Connecting-IP este de încredere numai fiindcă Nginx acceptă conexiuni
    # exclusiv de la cloudflared, prin loopback.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Documentele se descarcă doar prin view-ul Django autentificat.
    location = /media {
        return 404;
    }

    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
