[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["comparator/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["comparator", "pricecompare"]
omit = [
  "comparator/migrations/*",
  "comparator/tests/*",
  "manage.py",
  "pricecompare/asgi.py",
  "pricecompare/wsgi.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true
